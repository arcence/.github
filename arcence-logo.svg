<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="140" role="img" aria-label="Arcence Emblem">
  <!-- Clean 5-Voussoir Segmented Arch + Vermilion Keystone (Transparent Background) -->
  <!-- Outer Semicircular Arch Ring (R_out=64, R_in=34, center=(80, 96)) -->
  <path
    d="M 16 96 A 64 64 0 0 1 144 96 L 114 96 A 34 34 0 0 0 46 96 Z"
    fill="#DAD8D3"
    stroke="#1B1B1A"
    stroke-width="3"
  />

  <!-- Radial Voussoir Joints -->
  <line x1="80" y1="96" x2="25" y2="54" stroke="#1B1B1A" stroke-width="3.5" />
  <line x1="80" y1="96" x2="53" y2="30" stroke="#1B1B1A" stroke-width="3.5" />
  <line x1="80" y1="96" x2="107" y2="30" stroke="#1B1B1A" stroke-width="3.5" />
  <line x1="80" y1="96" x2="135" y2="54" stroke="#1B1B1A" stroke-width="3.5" />

  <!-- Central Vermilion Keystone (Slightly Proud at the Crown) -->
  <polygon
    points="62,24 98,24 90,64 70,64"
    fill="#B84A27"
    stroke="#1B1B1A"
    stroke-width="3"
  />

  <!-- Impost Baseline -->
  <line x1="8" y1="104" x2="152" y2="104" stroke="#DAD8D3" stroke-width="4" />
  <line x1="8" y1="104" x2="152" y2="104" stroke="#1B1B1A" stroke-width="1.5" />
</svg>
