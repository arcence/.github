<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="100%" role="img" aria-label="Arcence">
  <!-- Warm Stone Background Card -->
  <rect x="0" y="0" width="880" height="220" rx="6" fill="#DAD8D3" />
  <rect x="12" y="12" width="856" height="196" rx="2" fill="none" stroke="#1B1B1A" stroke-width="1.5" />

  <!-- Centered Iconic Arcence Arch & Keystone Mark + Wordmark -->
  <g transform="translate(178, 56)">
    <!-- Outer Seal Frame -->
    <rect x="0" y="0" width="108" height="108" rx="4" fill="#DAD8D3" stroke="#1B1B1A" stroke-width="3" />

    <!-- Left Structural Pier -->
    <path
      d="M 16 88 L 36 88 C 36 63, 42.5 46, 47.5 38 L 38.5 18 C 25.5 29, 16 53, 16 88 Z"
      fill="#1B1B1A"
    />

    <!-- Right Structural Pier -->
    <path
      d="M 92 88 L 72 88 C 72 63, 65.5 46, 60.5 38 L 69.5 18 C 82.5 29, 92 53, 92 88 Z"
      fill="#1B1B1A"
    />

    <!-- Suspended Vermilion Keystone -->
    <polygon
      points="42.5,13 65.5,13 59.5,39 48.5,39"
      fill="#B84A27"
      stroke="#DAD8D3"
      stroke-width="2.2"
    />

    <!-- Structural Tie-Beam -->
    <line x1="30" y1="67" x2="78" y2="67" stroke="#B84A27" stroke-width="3.2" />

    <!-- Impost Baseline -->
    <line x1="12" y1="88" x2="96" y2="88" stroke="#1B1B1A" stroke-width="3.5" />

    <!-- Clean Serif Wordmark -->
    <text
      x="142"
      y="64"
      fill="#1B1B1A"
      font-family="Georgia, 'Cormorant Garamond', 'Times New Roman', serif"
      font-size="54"
      font-weight="400"
      letter-spacing="14"
    >
      ARCENCE
    </text>

    <!-- Minimal Subtitle -->
    <text
      x="146"
      y="92"
      fill="#B84A27"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
      font-size="11.5"
      font-weight="600"
      letter-spacing="3.2"
    >
      BUILD AI · OWN INTELLIGENCE
    </text>
  </g>
</svg>
